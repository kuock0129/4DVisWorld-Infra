[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vw"
version = "0.0.1"
description = "4DVisWorld-Infra: simulator-agnostic infra for physically consistent counterfactual video tuples"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
mujoco = ["mujoco>=3.2"]
physx = ["sapien>=3.0"]
bench = ["mujoco>=3.2", "matplotlib>=3.7"]

[project.scripts]
vw = "vw.cli:main"

[tool.setuptools.packages.find]
include = ["vw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
